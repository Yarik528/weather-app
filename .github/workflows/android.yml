name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pngquant || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Generate launcher icons (PNG fallbacks)
        run: python3 scripts/gen_icons.py

      - name: Build release APK (signed with debug key — installable)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/weather-app-v1.0.0.apk
          ls -la out/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/weather-app-v1.0.0.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-apk
          path: out/weather-app-v1.0.0.apk
